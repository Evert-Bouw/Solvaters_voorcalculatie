name: Deploy Infra

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/core-deploy-infra.yml
    with:
      params_file: infra/app/parameters.prod.json
      template_file: infra/core/main.bicep
      azure_location: westeurope
    secrets: inherit
